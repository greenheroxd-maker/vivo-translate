name: Build Game Live Translator

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Instalar Tesseract OCR
        run: choco install tesseract -y

      - name: Build EXE
        shell: powershell
        run: |
          $tessDir = "C:\Program Files\Tesseract-OCR"

          if (!(Test-Path "$tessDir\tesseract.exe")) {
              Write-Error "No se encontro Tesseract en $tessDir"
              exit 1
          }

          pyinstaller --noconfirm --clean --onefile --windowed `
            --name GameLiveTranslator `
            --add-binary "$tessDir\tesseract.exe;." `
            --add-data "$tessDir\tessdata;tessdata" `
            GameLiveTranslator.py

      - name: Subir EXE
        uses: actions/upload-artifact@v4
        with:
          name: GameLiveTranslator-Windows
          path: dist/GameLiveTranslator.exe
